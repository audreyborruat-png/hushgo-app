</style></head><body><div id="app"></div><script>(function(g){
  const CHF = n => Math.round((Number(n)||0)*100)/100;
  function splitEven(total, ids){
    const cents=Math.round(CHF(total)*100), n=ids.length;if(!n)return{};
    const base=Math.floor(cents/n), rem=cents-base*n, out={};
    ids.forEach((id,i)=>out[id]=(base+(i<rem?1:0))/100); return out;
  }
  function computeBalances(adventure){
    const ids=adventure.participants.filter(p=>p.payer!==false).map(p=>p.id);
    const balances=Object.fromEntries(ids.map(id=>[id,0]));
    (adventure.expenses||[]).forEach(e=>{
      if(e.status==='cancelled')return;
      const shares=e.shares&&Object.keys(e.shares).length?e.shares:splitEven(e.amount,e.beneficiaryIds?.length?e.beneficiaryIds:ids);
      Object.entries(shares).forEach(([id,v])=>{if(id in balances)balances[id]-=CHF(v)});
      if(e.paidBy in balances)balances[e.paidBy]+=CHF(e.paidAmount ?? e.amount);
    });
    (adventure.transfers||[]).forEach(t=>{
      if(t.status!=='confirmed')return;
      if(t.from in balances)balances[t.from]+=CHF(t.amount);
      if(t.to in balances)balances[t.to]-=CHF(t.amount);
    });
    Object.keys(balances).forEach(id=>balances[id]=CHF(balances[id]));
    return balances;
  }
  function simplifyDebts(balances){
    const creditors=[], debtors=[];
    Object.entries(balances).forEach(([id,v])=>{const c=Math.round(v*100);if(c>0)creditors.push([id,c]);if(c<0)debtors.push([id,-c])});
    creditors.sort((a,b)=>b[1]-a[1]);debtors.sort((a,b)=>b[1]-a[1]);
    const tx=[];let i=0,j=0;
    while(i<debtors.length&&j<creditors.length){const amt=Math.min(debtors[i][1],creditors[j][1]);if(amt>0)tx.push({from:debtors[i][0],to:creditors[j][0],amount:amt/100});debtors[i][1]-=amt;creditors[j][1]-=amt;if(debtors[i][1]===0)i++;if(creditors[j][1]===0)j++;}
    return tx;
  }
  function budgetVoteResult(vote){
    const ids=vote.eligibleIds||[], answers=vote.answers||{};
    if(!ids.length)return 'pending';
    if(ids.some(id=>answers[id]===undefined))return 'pending';
    return ids.every(id=>answers[id]===true)?'approved':'not_approved';
  }
  function proposedBudget({people,nights,comfort,transport}){
    const c={economy:1,balanced:1.22,comfort:1.55}[comfort]||1.22;
    const stay=nights*72*c, meals=Math.max(1,nights*2+1)*31*c, acts=Math.max(1,nights)*38*c;
    const tr={car:42,public:65,flight:180,mixed:95}[transport]||65;
    const reserve=(stay+meals+acts+tr)*.08;
    return CHF(stay+meals+acts+tr+reserve);
  }
  function compatibility(anchor, candidate, radiusKm){
    if(!anchor||!candidate)return {ok:false,reason:'Données manquantes'};
    const toRad=x=>x*Math.PI/180,R=6371,dLat=toRad(candidate.lat-anchor.lat),dLon=toRad(candidate.lng-anchor.lng);
    const a=Math.sin(dLat/2)**2+Math.cos(toRad(anchor.lat))*Math.cos(toRad(candidate.lat))*Math.sin(dLon/2)**2;
    const km=R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
    return {ok:km<=radiusKm,km:Math.round(km*10)/10,reason:km<=radiusKm?'Compatible':'Hors zone'};
  }
  g.HushEngine={CHF,splitEven,computeBalances,simplifyDebts,budgetVoteResult,proposedBudget,compatibility};
})(window);
</script><script>const $=s=>document.querySelector(s); const E=HushEngine;

 const c=(val,label,icon='')=>`<button class="choice ${w.kind===val?'selected':''}" onclick="setWizard('kind','${val}')">${icon} ${label}</button>`;

 if(w.step===4)return `<h2>Où va-t-on ?</h2><p class="muted">Pour l’organisation répartie, la <b>ville de base est connue de tous</b>. Les hôtels, restaurants et activités peuvent rester secrets.</p><div class="label">Région</div><input class="input" value="${w.region}" placeholder="Ex. Alsace" oninput="setWizard('region',this.value,false)"><div class="label">Ville / base</div><input class="input" value="${w.city}" placeholder="Ex. Colmar" oninput="setWizard('city',this.value,false)"><div class="label">Périmètre maximum</div><input class="input" type="number" value="${w.radiusKm}" min="1" max="100" oninput="setWizard('radiusKm',Number(this.value),false)"><div class="tiny muted">HUSHGO guidera les équipes à l’intérieur de cette zone sans révéler les adresses secrètes.</div>`;
 if(w.step===5)return `<h2>Comment on bouge ?</h2><div class="choices">${['car|🚗 Voiture','public|🚆 Transports publics','flight|✈️ Avion','mixed|🧭 Mixte'].map(x=>{const [v,l]=x.split('|');return `<button class="choice ${w.transport===v?'selected':''}" onclick="setWizard('transport','${v}')">${l}</button>`}).join('')}</div><div class="note" style="margin-top:14px">Plus tard, chaque trajet pourra combiner marche, voiture, train, taxi, avion, location, etc.</div>`;
 if(w.step===6){if(!w.budgetProposal)w.budgetProposal=E.proposedBudget({people:w.people.length,nights:w.kind==='day'?0:w.kind==='weekend'?2:5,comfort:w.comfort,transport:w.transport});return `<h2>Quel budget ?</h2><p class="muted">HUSHGO propose une première enveloppe réaliste. Le groupe la valide ou la réduit ensemble.</p><div class="choices">${['economy|Économique','balanced|Équilibré','comfort|Confort'].map(x=>{const [v,l]=x.split('|');return `<button class="choice ${w.comfort===v?'selected':''}" onclick="setComfort('${v}')">${l}</button>`}).join('')}</div><div class="card" style="text-align:center"><div class="tiny muted">Proposition par payeur</div><div style="font-size:35px;font-weight:950;color:var(--plum);margin:6px">${money(w.budgetProposal)}</div><div class="tiny muted">estimation à confirmer, jamais une promesse de prix</div></div><div class="label">Budget commun retenu par personne</div><input class="input" type="number" value="${w.budgetAccepted||w.budgetProposal}" oninput="setWizard('budgetAccepted',Number(this.value),false)"><div class="secret-note" style="margin-top:12px"><b>Règle HUSHGO :</b> une hausse ultérieure ne passe que si tous les payeurs l’acceptent. Les refus restent confidentiels et leur nombre n’est jamais affiché.</div>`}
 if(w.step===7)return `<h2>Quel esprit ?</h2><div class="choices">${['Détente|🧖','Gourmand|🍷','Aventure|🥾','Fête|🎉','Nature|🌲','Surprise douce|🎁'].map(x=>{const [v,i]=x.split('|');return `<button class="choice ${w.vibe===v?'selected':''}" onclick="setWizard('vibe','${v}')">${i} ${v}</button>`}).join('')}</div><div class="label">Secrets</div><div class="secret-note">La ville/base est partagée. Pour chaque mission, l’équipe pourra choisir : <b>partager maintenant</b>, <b>garder secret</b> ou <b>révéler plus tard</b>.</div>`;
 return `<h2>Qui prépare quoi ?</h2><p class="muted">On crée les missions de départ. Elles pourront ensuite être prises seul ou en équipe.</p><div class="card">${[['hotel','🛏️ Hébergement'],['restaurant','🍽️ Repas'],['activity','🎈 Activité'],['transport','🚗 Transport']].map(([v,l])=>`<label class="budget-line"><span>${l}</span><input type="checkbox" ${w.missions.includes(v)?'checked':''} onchange="toggleMission('${v}',this.checked)"></label>`).join('')}</div><div class="note">Les repas, activités ou transports supplémentaires pourront être ajoutés ensuite. On ne surcharge pas le départ.</div>`
}
function setWizard(k,v,r=true){S.wizard[k]=v;save();if(r)render()} function setComfort(v){S.wizard.comfort=v;S.wizard.budgetProposal=E.proposedBudget({people:S.wizard.people.length,nights:S.wizard.kind==='day'?0:S.wizard.kind==='weekend'?2:5,comfort:v,transport:S.wizard.transport});S.wizard.budgetAccepted=S.wizard.budgetProposal;save();render()}
function addPerson(){const i=$('#new-person');if(!i.value.trim())return;S.wizard.people.push(i.value.trim());save();render()} function removePerson(i){if(i===0)return;S.wizard.people.splice(i,1);save();render()} function toggleMission(v,on){if(on&&!S.wizard.missions.includes(v))S.wizard.missions.push(v);if(!on)S.wizard.missions=S.wizard.missions.filter(x=>x!==v);save()}
function wizardBack(){if(S.wizard.step===1){S.screen='adventures';S.wizard=null}else S.wizard.step--;save();render()}
function wizardNext(){const w=S.wizard;if(w.step===1&&!w.name.trim())return toast('Donne un nom à l’aventure');if(w.step===4&&(!w.region.trim()||!w.city.trim()))return toast('Région et ville de base sont nécessaires');if(w.step<8){w.step++;save();render();return}createAdventureFromWizard()}
function createAdventureFromWizard(){const w=S.wizard,id='a'+Date.now();const people=w.people.map((n,i)=>({id:'p'+Date.now()+i,name:n,payer:true}));const icons={hotel:'🛏️',restaurant:'🍽️',activity:'🎈',transport:'🚗'},titles={hotel:'Hébergement',restaurant:'Repas',activity:'Activité',transport:'Transport'};const missions=w.missions.map((t,i)=>({id:'m'+Date.now()+i,type:t,title:titles[t],icon:icons[t],team:[],status:i===0?'open':'waiting',secret:t!=='transport',anchor:t==='hotel',budget:0,dependsOn:i>0&&w.missions.includes('hotel')?['m'+Date.now()]:[]}));const a={id,name:w.name,emoji:w.kind==='day'?'☀️':w.kind==='weekend'?'🧳':'✈️',kind:w.kind,dates:w.dateKnown?w.dates:'Dates à voter',city:w.city,region:w.region,radiusKm:w.radiusKm,budgetPerPayer:w.budgetAccepted||w.budgetProposal,reservePerPayer:Math.round((w.budgetAccepted||w.budgetProposal)*.08),vibe:w.vibe,visibility:{city:'shared'},participants:people,missions,expenses:[],transfers:[],fundingRequests:[],chat:[{id:'c'+Date.now(),who:'system',text:`Bienvenue dans ${w.name}. ${w.city} est notre base. À vous de préparer le reste 🤫`}],memories:[],budgetVotes:[]};S.adventures.unshift(a);S.activeAdventureId=id;S.screen='adventure';S.activeTab='home';S.wizard=null;save();render()}
function openAdventure(id){S.activeAdventureId=id;S.screen='adventure';S.activeTab='home';save();render()} function openTab(t){if(!S.activeAdventureId)return go('adventures');S.screen='adventure';S.activeTab=t;save();render()} function go(x){S.screen=x;save();render()}
function adventureView(){const a=adv();if(!a)return go('adventures');return `${top(a.name,`${a.city} · ${a.dates}`)}<div class="page"><div class="tabs">${['home|Aventure','chat|Chat','missions|Missions','budget|Budget','memories|Souvenirs'].map(x=>{const[v,l]=x.split('|');return `<button class="tab ${S.activeTab===v?'active':''}" onclick="openTab('${v}')">${l}</button>`}).join('')}</div>${S.activeTab==='home'?homeTab(a):S.activeTab==='chat'?chatTab(a):S.activeTab==='missions'?missionsTab(a):S.activeTab==='budget'?budgetTab(a):memoriesTab(a)}</div>${nav(S.activeTab==='home'?'adventures':S.activeTab)}`}
function homeTab(a){const done=a.missions.filter(m=>m.status==='confirmed').length;return `<div class="hero"><div class="kicker">${a.vibe}</div><h1>${a.city}</h1><p>${a.region} · périmètre ${a.radiusKm} km · ${a.participants.length} participants</p></div><div class="stat-grid" style="margin-top:14px"><div class="stat"><div class="n">${done}/${a.missions.length}</div><div class="tiny muted">missions prêtes</div></div><div class="stat"><div class="n">${money(a.budgetPerPayer)}</div><div class="tiny muted">budget / payeur</div></div></div><div class="card"><div class="row between"><div><div class="bold">🎉 Préparation en cours</div><div class="small muted">HUSHGO garde les secrets et vérifie l’ensemble.</div></div><span class="pill green">${Math.round(done/Math.max(1,a.missions.length)*100)}%</span></div><div class="progress"><span style="width:${Math.round(done/Math.max(1,a.missions.length)*100)}%"></span></div></div><div class="card"><div class="bold">🤫 Un peu de teasing ?</div><p class="small muted">Faites rire le groupe sans dévoiler les surprises.</p><button class="btn soft full" onclick="autoJoke()">HUSHGO, lance un petit message</button></div>`}
function chatTab(a){return `<div class="card"><div class="bold">💬 Chat de l’aventure</div><div class="tiny muted">On discute ici de ce qui est commun. Les détails secrets restent dans les chats de mission.</div></div>${a.chat.map(m=>{const u=S.users.find(x=>x.id===m.who)||a.participants.find(x=>x.id===m.who);return `<div class="message"><div class="avatar">${m.who==='system'?'H':(u?.name||'?')[0]}</div><div class="bubble ${m.who==='system'?'system':''}"><div class="tiny bold">${m.who==='system'?'HUSHGO':u?.name||'Participant'}</div>${m.text}</div></div>`}).join('')}<div class="chat-compose"><input id="chat-input" class="input" placeholder="Écris au groupe…"><button class="send" onclick="sendChat()">➤</button></div>`}
function sendChat(){const i=$('#chat-input');if(!i||!i.value.trim())return;adv().chat.push({id:'c'+Date.now(),who:S.me,text:i.value.trim()});save();render()}
function autoJoke(){const a=adv(),msgs=[`Quelqu’un prépare quelque chose à ${a.city}. Non, vous n’aurez pas plus d’infos 😏`,`Petit rappel : espionner le téléphone des autres annule 12 points de karma HUSHGO.`,`Une mission avance. Votre curiosité, elle, n’avance pas du tout 🤫`,`Indice officiel : vous aurez probablement besoin de chaussures. Voilà. Débrouillez-vous avec ça 😂`];a.chat.push({id:'c'+Date.now(),who:'system',text:msgs[Math.floor(Math.random()*msgs.length)]});save();S.activeTab='chat';render()}
function missionsTab(a){return `<div class="card"><div class="bold">Missions</div><div class="tiny muted">Une mission peut être prise seul ou en équipe. Certaines se débloquent quand l’étape ancre est prête.</div></div>${a.missions.map(m=>missionCard(a,m)).join('')}<button class="btn soft full" onclick="addMission()">＋ Ajouter une mission</button>`}
function missionCard(a,m){const waiting=m.status==='waiting';return `<div class="card mission"><div class="mission-icon">${m.icon}</div><div><div class="bold">${m.title}</div><div class="small ${waiting?'status-wait':'muted'}">${waiting?'Encore verrouillée':'À préparer'} ${m.secret?'· secret':''}</div></div><button class="btn ${waiting?'ghost':'soft'}" onclick="missionAction('${m.id}')">${waiting?'🔒':'Ouvrir'}</button></div>`}
function missionAction(id){const m=adv().missions.find(x=>x.id===id);if(m.status==='waiting')return toast('Cette mission attend encore son point d’ancrage');m.status=m.status==='confirmed'?'open':'confirmed';if(m.anchor&&m.status==='confirmed')adv().missions.forEach(x=>{if(x.status==='waiting')x.status='open'});save();toast(m.status==='confirmed'?'Mission confirmée 🤫':'Mission rouverte')}
function addMission(){const a=adv(),id='m'+Date.now();a.missions.push({id,type:'free',title:'Surprise libre',icon:'🎁',team:[],status:'open',secret:true,budget:0});save();render()}
function budgetTab(a){const bal=E.computeBalances(a),settle=E.simplifyDebts(bal);const total=a.expenses.filter(e=>e.status!=='cancelled').reduce((s,e)=>s+Number(e.amount||0),0);const vote=a.budgetVotes[a.budgetVotes.length-1];return `<div class="card"><div class="row between"><div><div class="bold">💸 Cagnotte comptable</div><div class="tiny muted">HUSHGO calcule. L’argent reste entre vous.</div></div><span class="pill">${money(a.budgetPerPayer)} / pers.</span></div></div><div class="stat-grid"><div class="stat"><div class="n">${money(total)}</div><div class="tiny muted">dépenses enregistrées</div></div><div class="stat"><div class="n">${money(a.reservePerPayer*a.participants.filter(p=>p.payer).length)}</div><div class="tiny muted">réserve imprévus prévue</div></div></div><h3>Versements pour réserver</h3>${(a.fundingRequests||[]).map(f=>fundingRequestCard(a,f)).join('')||'<div class="small muted">Aucun versement demandé.</div>'}<button class="btn coral full" style="margin-top:10px" onclick="openFundingModal()">Demander des versements</button><h3>Avances et remboursements</h3>${a.expenses.map(e=>`<div class="card"><div class="row between"><div><div class="bold">${e.label}</div><div class="tiny muted">Payé par ${nameOf(a,e.paidBy)}</div></div><div class="amount">${money(e.amount)}</div></div></div>`).join('')||'<div class="empty"><div class="big">💸</div><div>Aucune dépense encore</div></div>'}<button class="btn soft full" onclick="openExpenseModal()">＋ Ajouter une dépense / avance</button><button class="btn ghost full" style="margin-top:8px" onclick="openTransferModal()">↔ Enregistrer un remboursement</button><h3>Soldes</h3>${Object.entries(bal).map(([id,v])=>`<div class="budget-line"><span>${nameOf(a,id)}</span><span class="amount ${v>=0?'positive':'negative'}">${v>=0?'+':''}${money(v)}</span></div>`).join('')} ${settle.length?`<div class="secret-note" style="margin-top:14px"><b>Pour solder simplement :</b><br>${settle.map(t=>`${nameOf(a,t.from)} → ${nameOf(a,t.to)} : <b>${money(t.amount)}</b>`).join('<br>')}</div>`:''}<h3>Budget supplémentaire</h3>${vote?voteCard(a,vote):'<div class="small muted">Aucune demande en cours.</div>'}<button class="btn coral full" style="margin-top:10px" onclick="createBudgetVote()">Demander une augmentation</button>`}
function nameOf(a,id){return a.participants.find(p=>p.id===id)?.name||S.users.find(u=>u.id===id)?.name||'Participant'}
function voteCard(a,v){const r=E.budgetVoteResult(v);return `<div class="card"><div class="row between"><div><div class="bold">+ ${money(v.perPayer)} / payeur</div><div class="tiny muted">${r==='pending'?'Consultation en cours':r==='approved'?'Augmentation approuvée':'Augmentation non approuvée'}</div></div><span class="pill ${r==='approved'?'green':r==='not_approved'?'amber':''}">${r==='pending'?'Privé':r==='approved'?'OK':'Terminé'}</span></div>${r==='pending'?`<div class="secret-note" style="margin-top:12px"><b>Ta réponse reste confidentielle.</b> Personne ne saura qui a refusé ni combien de personnes ont refusé. Seul le résultat final sera affiché.</div><div class="row" style="margin-top:10px"><button class="btn soft grow" onclick="answerBudgetVote(true)">J’accepte</button><button class="btn ghost grow" onclick="answerBudgetVote(false)">Je préfère garder le budget</button></div>`:''}</div>`}

function fundingRequestCard(a,f){
  const entries=Object.entries(f.allocations||{}), confirmed=entries.filter(([id])=>f.statuses?.[id]==='confirmed'), declared=entries.filter(([id])=>f.statuses?.[id]==='declared');
  const received=confirmed.reduce((sum,[id,amt])=>sum+Number(amt||0),0), requested=entries.reduce((sum,[id,amt])=>sum+Number(amt||0),0);
  const mine=f.allocations?.[S.me], myStatus=f.statuses?.[S.me];
  return `<div class="card"><div class="row between"><div><div class="bold">${f.label}</div><div class="tiny muted">${nameOf(a,f.requestedBy)} doit payer ${money(f.amountDueNow)} maintenant</div></div><span class="pill ${received>=requested?'green':''}">${money(received)} reçus</span></div><div class="progress"><span style="width:${requested?Math.round(received/requested*100):100}%"></span></div><div class="small muted">${confirmed.length} versement(s) confirmé(s). Les noms des retardataires ne sont pas affichés au groupe.</div>${mine&&S.me!==f.requestedBy?`<div class="secret-note" style="margin-top:10px">Ta part à verser à ${nameOf(a,f.requestedBy)} : <b>${money(mine)}</b><br><span class="tiny">TWINT, cash, virement… choisis librement.</span></div>${myStatus==='requested'?`<button class="btn soft full" style="margin-top:9px" onclick="declareFundingPaid('${f.id}')">J’ai payé</button>`:myStatus==='declared'?'<div class="pill amber" style="margin-top:9px">Réception à confirmer</div>':'<div class="pill green" style="margin-top:9px">Paiement confirmé</div>'}`:''}${S.me===f.requestedBy&&declared.length?`<div class="divider"></div><div class="tiny bold">À confirmer</div>${declared.map(([id,amt])=>`<div class="row between" style="margin-top:8px"><span>${nameOf(a,id)} · ${money(amt)}</span><button class="btn soft" onclick="confirmFundingReceived('${f.id}','${id}')">Reçu</button></div>`).join('')}`:''}</div>`
}
function openFundingModal(){const a=adv();modal(`<div class="bold">Demander des versements</div><div class="small muted">Exemple : acompte nécessaire pour pouvoir réserver l’hôtel.</div><div class="label">Pour quoi ?</div><input id="f-label" class="input" placeholder="Ex. Acompte hébergement"><div class="label">Montant à payer maintenant</div><input id="f-amount" type="number" class="input" placeholder="400"><div class="label">Qui va payer la réservation ?</div><select id="f-requester" class="input">${a.participants.filter(p=>p.payer).map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><div class="note" style="margin-top:12px">HUSHGO demandera aux autres payeurs leur part. Ils choisissent eux-mêmes TWINT, cash ou virement. La personne qui reçoit confirme chaque versement.</div><button class="btn primary full" style="margin-top:16px" onclick="saveFundingRequest()">Envoyer les demandes</button>`)}
function saveFundingRequest(){const a=adv(),amount=Number($('#f-amount').value),requestedBy=$('#f-requester').value,label=$('#f-label').value.trim()||'Versement pour réservation';if(!amount)return toast('Montant nécessaire');const ids=a.participants.filter(p=>p.payer).map(p=>p.id),shares=E.splitEven(amount,ids),allocations={},statuses={};ids.forEach(id=>{if(id!==requestedBy){allocations[id]=shares[id];statuses[id]='requested'}});a.fundingRequests=a.fundingRequests||[];a.fundingRequests.push({id:'f'+Date.now(),label,requestedBy,amountDueNow:amount,allocations,statuses});closeModal();save();render()}
function declareFundingPaid(fid){const f=adv().fundingRequests.find(x=>x.id===fid);if(!f||!f.allocations[S.me])return;f.statuses[S.me]='declared';save();render()}
function confirmFundingReceived(fid,pid){const a=adv(),f=a.fundingRequests.find(x=>x.id===fid);if(!f||f.requestedBy!==S.me)return;f.statuses[pid]='confirmed';a.transfers.push({id:'t'+Date.now(),from:pid,to:f.requestedBy,amount:f.allocations[pid],method:'versement réservation',status:'confirmed'});save();render()}

function createBudgetVote(){const a=adv(),eligible=a.participants.filter(p=>p.payer).map(p=>p.id);a.budgetVotes.push({id:'v'+Date.now(),perPayer:25,eligibleIds:eligible,answers:{},createdAt:Date.now()});save();render()}
function answerBudgetVote(ok){const a=adv(),v=a.budgetVotes[a.budgetVotes.length-1];v.answers[S.me]=ok;const r=E.budgetVoteResult(v);if(r==='approved')a.budgetPerPayer+=v.perPayer;save();render()}
function openExpenseModal(){const a=adv();modal(`<div class="bold">Ajouter une dépense</div><div class="label">Libellé</div><input id="e-label" class="input" placeholder="Ex. Hôtel"><div class="label">Montant total</div><input id="e-amount" type="number" class="input" placeholder="800"><div class="label">Qui a payé ?</div><select id="e-payer" class="input">${a.participants.filter(p=>p.payer).map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><button class="btn primary full" style="margin-top:16px" onclick="saveExpense()">Enregistrer</button>`) }
function saveExpense(){const a=adv(),label=$('#e-label').value.trim()||'Dépense',amount=Number($('#e-amount').value),paidBy=$('#e-payer').value;if(!amount)return toast('Montant nécessaire');a.expenses.push({id:'e'+Date.now(),label,amount,paidAmount:amount,paidBy,beneficiaryIds:a.participants.filter(p=>p.payer).map(p=>p.id),status:'paid'});closeModal();save();render()}
function openTransferModal(){const a=adv();modal(`<div class="bold">Enregistrer un remboursement</div><div class="label">Qui a payé ?</div><select id="t-from" class="input">${a.participants.filter(p=>p.payer).map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><div class="label">À qui ?</div><select id="t-to" class="input">${a.participants.filter(p=>p.payer).map(p=>`<option value="${p.id}">${p.name}</option>`).join('')}</select><div class="label">Montant</div><input id="t-amount" type="number" class="input" placeholder="200"><div class="label">Moyen (facultatif)</div><input id="t-method" class="input" placeholder="TWINT, cash, virement…"><button class="btn primary full" style="margin-top:16px" onclick="saveTransfer()">Enregistrer</button>`) }
function saveTransfer(){const a=adv(),from=$('#t-from').value,to=$('#t-to').value,amount=Number($('#t-amount').value),method=$('#t-method').value.trim();if(!amount||from===to)return toast('Vérifie les personnes et le montant');a.transfers.push({id:'t'+Date.now(),from,to,amount,method,status:'confirmed'});closeModal();save();render()}
function memoriesTab(a){return `<div class="hero"><div class="kicker">Après et pendant</div><h1>Nos souvenirs</h1><p>Photos, petits mots et coulisses. Tout le monde peut participer.</p></div><div class="mem-grid" style="margin-top:14px">${a.memories.map(m=>`<div class="memory"><div class="ph">${m.emoji||'📸'}</div><div class="txt">${m.text}<div class="tiny muted" style="margin-top:5px">${nameOf(a,m.who)}</div></div></div>`).join('')}</div><button class="btn soft full" style="margin-top:14px" onclick="addMemory()">＋ Ajouter un souvenir</button><button class="btn ghost full" style="margin-top:8px" onclick="albumPreview()">📖 Prévisualiser l’album</button>`}
function addMemory(){modal(`<div class="bold">Ajouter un souvenir</div><div class="label">Petit mot</div><textarea id="mem-text" class="input" placeholder="Ce qu’on voudra encore raconter dans 10 ans…"></textarea><div class="label">Emoji photo (démo)</div><input id="mem-emoji" class="input" value="📸"><button class="btn primary full" style="margin-top:16px" onclick="saveMemory()">Ajouter</button>`) }
function saveMemory(){const text=$('#mem-text').value.trim();if(!text)return;adv().memories.push({id:'r'+Date.now(),who:S.me,text,emoji:$('#mem-emoji').value||'📸'});closeModal();save();render()}
function albumPreview(){const a=adv();modal(`<div class="bold">Album HUSHGO</div><div class="small muted">${a.name} · ${a.city} · ${a.dates}</div><div class="divider"></div>${a.memories.map(m=>`<div class="card"><div style="font-size:32px">${m.emoji||'📸'}</div><div>${m.text}</div><div class="tiny muted">— ${nameOf(a,m.who)}</div></div>`).join('')||'<div class="empty">Ajoutez d’abord quelques souvenirs.</div>'}<button class="btn primary full" onclick="window.print()">Imprimer / enregistrer en PDF</button><div class="tiny muted" style="margin-top:8px">La vraie version générera ensuite automatiquement un PDF mis en page.</div>`) }
